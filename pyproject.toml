[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-resume-manager"
version = "0.1.0"
description = "Build a single-page A4 PDF from a Markdown resume."
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0,<4.0",
    "playwright>=1.45,<2.0",
]

[project.scripts]
resume-manager = "resume_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
